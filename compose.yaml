name: voltcart
services:
  app:
    build: .
    ports: ["4202:8080"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/voltcart
      RELEASE_COLOR: local
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
  mongo:
    image: mongo:7
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports: ["4302:9090"]
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
  grafana:
    image: grafana/grafana:12.1.0
    profiles: [monitoring]
    ports: ["4402:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-local-demo-change-me}
    volumes: ["grafana-data:/var/lib/grafana", "./ops/grafana:/etc/grafana/provisioning:ro"]
volumes:
  mongo-data:
  grafana-data:
