name: Staging and approved production
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voltcart-deployment
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.tag.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Image tag
        id: tag
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: echo "image=$USERNAME/voltcart:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tag.outputs.image }}
  staging:
    needs: image
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_BASE64 }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config
      - run: bash ops/deploy.sh
        env:
          APP: voltcart
          IMAGE: ${{ needs.image.outputs.image }}
          NAMESPACE: voltcart-staging
  production:
    needs: [image, staging]
    environment: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_BASE64 }}
        run: |
          mkdir -p ~/.kube
          printf '%s' "$KUBE_CONFIG" | base64 --decode > ~/.kube/config
          chmod 600 ~/.kube/config
      - run: bash ops/deploy.sh
        env:
          APP: voltcart
          IMAGE: ${{ needs.image.outputs.image }}
          NAMESPACE: voltcart-production
